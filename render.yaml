# Render.com için otomatik ayar dosyası (Blueprint).
# GitHub'a bu dosya dahil push edildiğinde Render tek tıkla kurar.
services:
  - type: web
    name: klinik-analiz
    runtime: python
    plan: free                       # ücretsiz plan
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO
        value: "true"               # ilk açılışta anahtarsız çalışsın (göstermelik)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false                 # anahtarı panelden gizli olarak sen gireceksin
