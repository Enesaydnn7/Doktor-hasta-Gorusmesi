# Render.com için otomatik ayar dosyası (Blueprint).
# GitHub'a bu dosya dahil push edildiğinde Render tek tıkla kurar.
services:
  - type: web
    name: klinik-analiz
    runtime: python
    plan: free                       # ücretsiz plan
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false                 # anahtarı panelden gizli olarak sen gireceksin
      - key: APP_VERSION
        value: v2.8.5
      - key: COMED_WEB_BASE_URL
        value: http://goztepe.comedtest.mlpcare.com/tr-tr/medical
      - key: COMED_API_BASE_URL
        value: http://goztepe.comedtestapi.mlpcare.com/tr-tr/api/json
      - key: MOBILE_SESSION_DAYS
        value: 30
      - key: MOBILE_DOCTOR_USER
        sync: false
      - key: MOBILE_DOCTOR_PASS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SEED_MANAGER_DEMO
        value: true
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v2
      - key: ELEVENLABS_STT_LANGUAGE
        value: tr
      - key: ELEVENLABS_API_KEY
        sync: false                 # ElevenLabs anahtarını Render panelinden gir
      - key: OPENAI_STT_MODEL
        value: gpt-4o-transcribe-diarize
      - key: OPENAI_STT_FALLBACK_MODEL
        value: gpt-transcribe
      - key: OPENAI_API_KEY
        sync: false                 # OpenAI Platform anahtarını Render panelinden gir
